
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Online Registration Form</h1>
        <p>Please fill in the details below to register.</p>
    </header>

    <form id="registrationForm">

        <h2>Personal Information</h2>

        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label>Gender *</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
            </select>
        </div>

        <h2>Contact Information</h2>

        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number"
                   pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="form-group">
            <label>Address *</label>
            <textarea id="address"
                      placeholder="Enter your address"
                      required></textarea>
        </div>

        <h2>Educational Information</h2>

        <div class="form-group">
            <label>Qualification *</label>
            <select id="qualification" required>
                <option value="">Select Qualification</option>
                <option>10th Standard</option>
                <option>12th Standard</option>
                <option>Diploma</option>
                <option>Undergraduate</option>
                <option>Postgraduate</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Course / Program *</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Business Administration</option>
                <option>Commerce</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="declaration" required>
                I hereby declare that the information provided is correct.
            </label>
        </div>

        <button type="submit" class="submit-btn">
            Submit Application
        </button>

        <button type="reset" class="reset-btn">
            Reset Form
        </button>

    </form>

    <!-- Registration result -->
    <div id="result" class="result" hidden>
        <div class="success-message">
            <h2>Registration Successful!</h2>
            <p>Your application has been submitted successfully.</p>
        </div>

        <h2>Application Details</h2>

        <div id="displayDetails"></div>

        <button onclick="window.print()" class="print-btn">
            Print / Save as PDF
        </button>

        <button onclick="newApplication()" class="reset-btn no-print">
            New Application
        </button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
